<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Section Writing Stats for Obsidian</title>
  <desc id="description">A social preview card showing a writing-statistics badge with words, characters, reading time, and writing-target progress.</desc>
  <defs>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b487ff"/>
      <stop offset="1" stop-color="#7442bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="0" flood-color="#5e329b" flood-opacity=".72"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#19171d"/>
  <path d="M0 602C248 506 438 614 670 505c194-91 324-248 530-241v366H0Z" fill="#241437"/>
  <path d="M0 630c312-124 507 20 754-122 154-89 252-192 446-188v310H0Z" fill="#2d1946"/>
  <text x="76" y="158" fill="#fffaff" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="800" letter-spacing="-3">Section Writing Stats</text>
  <text x="76" y="238" fill="url(#violet)" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="800" letter-spacing="-3">for Obsidian</text>
  <g filter="url(#shadow)">
    <rect x="76" y="320" width="1048" height="88" rx="22" fill="#fbfaff"/>
    <rect x="76" y="320" width="1048" height="88" rx="22" fill="none" stroke="#d9d5df" stroke-width="3"/>
    <text x="112" y="378" fill="#211f25" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">128 words</text>
    <text x="332" y="378" fill="#77727c" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">•</text>
    <text x="378" y="378" fill="#211f25" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">0m 43s</text>
    <path d="M526 339v50" stroke="#dfdbe3" stroke-width="2"/>
    <text x="560" y="378" fill="#8e8993" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Target</text>
    <text x="678" y="378" fill="#211f25" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">85%</text>
    <rect x="790" y="358" width="274" height="20" rx="10" fill="#e5e4e7"/>
    <rect x="790" y="358" width="232" height="20" rx="10" fill="#75c991"/>
  </g>
